name: Build check
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "*.md"
    types:
      - opened
      - synchronize
      - reopened
  push:
    paths-ignore:
      - "*.md"
    branches:
      - main
      - android-port

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
